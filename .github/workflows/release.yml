name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as release (e.g. v1.0.1). Leave empty to build without publishing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Generate PNG + ICO on Ubuntu, shared with Linux + Windows builds
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate PNG + ICO from SVG
        run: |
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p build
          rsvg-convert -w 512 -h 512 public/favicon.svg -o build/icon.png
          convert build/icon.png \
            \( -clone 0 -resize 256x256 \) \
            \( -clone 0 -resize 128x128 \) \
            \( -clone 0 -resize 64x64  \) \
            \( -clone 0 -resize 48x48  \) \
            \( -clone 0 -resize 32x32  \) \
            \( -clone 0 -resize 16x16  \) \
            -delete 0 build/icon.ico
          echo "Icons generated:"
          ls -lh build/

      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/

  # Build Linux (.AppImage, .deb)
  build-linux:
    needs: icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build Linux
        run: npx electron-builder --linux --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Build Windows (.exe installer + portable)
  build-win:
    needs: icons
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build Windows
        run: npx electron-builder --win --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            dist/*.exe
          if-no-files-found: error

  # Build macOS (universal DMG — Intel + Apple Silicon)
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .icns from SVG
        run: |
          brew install librsvg
          mkdir -p build build/icon.iconset
          rsvg-convert -w 1024 -h 1024 public/favicon.svg -o /tmp/icon1024.png
          sips -z 16   16   /tmp/icon1024.png --out build/icon.iconset/icon_16x16.png
          sips -z 32   32   /tmp/icon1024.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   /tmp/icon1024.png --out build/icon.iconset/icon_32x32.png
          sips -z 64   64   /tmp/icon1024.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  /tmp/icon1024.png --out build/icon.iconset/icon_128x128.png
          sips -z 256  256  /tmp/icon1024.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  /tmp/icon1024.png --out build/icon.iconset/icon_256x256.png
          sips -z 512  512  /tmp/icon1024.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  /tmp/icon1024.png --out build/icon.iconset/icon_512x512.png
          cp /tmp/icon1024.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
          echo "icon.icns generated:"
          ls -lh build/icon.icns

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build macOS
        run: npx electron-builder --mac --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist/*.dmg
          if-no-files-found: error

  # Create GitHub Release — only on tag push or explicit dispatch tag
  publish:
    needs: [build-linux, build-win, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - name: List release files
        run: ls -lh release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-files/**
          generate_release_notes: true
          fail_on_unmatched_files: false
